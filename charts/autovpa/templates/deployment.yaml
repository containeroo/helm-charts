---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 8 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.profile.configMap.create .Values.podAnnotations }}
      annotations:
        {{- if .Values.profile.configMap.create }}
        checksum/profiles: {{ include (print $.Template.BasePath "/profile-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: autovpa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.watch.currentNamespace .Values.env }}
          env:
            {{- if .Values.watch.currentNamespace }}
            - name: AUTO_VPA_WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: probes
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
          args:
            {{- if not .Values.metrics.enabled }}
            - --metrics-enabled=false
            {{- end }}
            {{- if .Values.metrics.address }}
            - --metrics-bind-address={{ .Values.metrics.address }}
            {{- end }}
            {{- if not .Values.metrics.secure }}
            - --metrics-secure=false
            {{- end }}
            {{- if .Values.probes.address }}
            - --health-probe-bind-address={{ .Values.probes.address }}
            {{- end }}
            {{- if .Values.server.enableHTTP2 }}
            - --enable-http2
            {{- end }}
            - --leader-elect={{ .Values.leaderElection.enabled }}
            {{- range .Values.watch.namespaces }}
            - --watch-namespace={{ . }}
            {{- end }}
            - --config={{ .Values.profile.path }}
            - --profile-annotation={{ .Values.profile.annotation }}
            - --managed-label={{ .Values.profile.managedLabel }}
            - --vpa-name-template={{ .Values.profile.nameTemplate }}
            {{- if ne .Values.logging.format "json" }}
            - --log-encoder={{ .Values.logging.format }}
            {{- end }}
            {{- if .Values.logging.devel }}
            - --log-devel
            {{- end }}
            {{- if ne .Values.logging.stacktraceLevel "panic" }}
            - --log-stacktrace-level={{ .Values.logging.stacktraceLevel }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.profile.configMap.create .Values.profile.configMap.name }}
          volumeMounts:
            - name: profiles
              mountPath: {{ .Values.profile.path }}
              subPath: {{ .Values.profile.configMap.key }}
              readOnly: true
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- toYaml .Values.startupProbe.spec | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe.spec | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe.spec | nindent 12 }}
          {{- end }}
        {{- if .Values.sidecars }}
        {{- toYaml .Values.sidecars | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.profile.configMap.create .Values.profile.configMap.name }}
      volumes:
        - name: profiles
          configMap:
            name: {{ include "chart.profileConfigMapName" . }}
            items:
              - key: {{ .Values.profile.configMap.key }}
                path: {{ .Values.profile.configMap.key }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
