{{- $namespacedWatch := or .Values.watch.currentNamespace (gt (len .Values.watch.namespaces) 0) -}}
{{- if and .Values.clusterRole.create (not $namespacedWatch) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.clusterRoleName" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
  {{- include "chart.controllerRules" . | nindent 2 }}
  {{- with .Values.clusterRole.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chart.clusterRoleName" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chart.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.serviceAccountName" . }}
    namespace: {{ include "chart.namespaceName" . }}
{{- end }}

{{- if or .Values.role.create $namespacedWatch }}
{{- $namespaces := .Values.watch.namespaces }}
{{- if .Values.watch.currentNamespace }}
{{- $namespaces = list (include "chart.namespaceName" .) }}
{{- else if eq (len $namespaces) 0 }}
{{- $namespaces = list (include "chart.namespaceName" .) }}
{{- end }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.roleName" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
rules:
  {{- include "chart.controllerRules" $ | nindent 2 }}
  {{- with $.Values.role.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.roleName" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart.roleName" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.serviceAccountName" $ }}
    namespace: {{ include "chart.namespaceName" $ }}
{{- end }}
{{- end }}
