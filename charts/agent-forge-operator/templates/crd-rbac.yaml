{{- if .Values.crdRoles.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.crdRoles.adminName }}
  labels:
    {{- include "agent-forge-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagentpools
  - openstackagentpools
  - vsphereagents
  - openstackagents
  verbs:
  - '*'
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagentpools/status
  - openstackagentpools/status
  - vsphereagents/status
  - openstackagents/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.crdRoles.editorName }}
  labels:
    {{- include "agent-forge-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagentpools
  - openstackagentpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagentpools/status
  - openstackagentpools/status
  verbs:
  - get
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagents
  - openstackagents
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagents/status
  - openstackagents/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.crdRoles.viewerName }}
  labels:
    {{- include "agent-forge-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagentpools
  - openstackagentpools
  - vsphereagents
  - openstackagents
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agent-forge.containeroo.ch
  resources:
  - vsphereagentpools/status
  - openstackagentpools/status
  - vsphereagents/status
  - openstackagents/status
  verbs:
  - get
{{- end }}
