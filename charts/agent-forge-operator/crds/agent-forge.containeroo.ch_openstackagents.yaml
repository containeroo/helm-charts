                        type: string
                      diskGiB:
                        default: 120
                        format: int32
                        maximum: 65536
                        minimum: 20
                        type: integer
                      installationDisk:
                        default: /dev/vda
                        description: |-
                          InstallationDisk is an explicit Assisted Installer inventory disk path.
                          It must match the OS volume's serial and must never identify a CD-ROM.
                        pattern: ^/dev/[a-zA-Z0-9/_-]+$
                        type: string
                      osDiskBus:
                        default: virtio
                        enum:
                        - virtio
                        - scsi
                        - sata
                        - ide
                        type: string
                      osVolumePolicy:
                        default: Delete
                        description: |-
