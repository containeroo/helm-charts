name: Sync local-path-provisioner chart

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install yq
        uses: mikefarah/yq@f2944b823f84906a127dbd29e4c2a3e60c4e550e # v4

      - name: Sync chart from upstream
        run: ./.github/scripts/sync-local-path-provisioner.sh

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          commit-message: "chore: sync local-path-provisioner chart"
          title: "chore: sync local-path-provisioner chart"
          body: "Automated update from rancher/local-path-provisioner."
          branch: "automation/local-path-provisioner-sync"
          delete-branch: true
